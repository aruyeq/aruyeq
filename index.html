<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fff5f8">
  <meta name="description" content="aruyeq. — moje profile i linki">
  <title>aruyeq.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --accent: #db2777;
      --text: #1f1f1f;
      --muted: #6b7280;
      --line: rgba(219, 39, 119, 0.15);
      --background: #fff5f8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html {
      width: 100%;
      min-height: 100%;
      overflow-x: clip;
      -webkit-text-size-adjust: 100%;
    }
    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding:
        max(24px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      overflow-x: clip;
      background: var(--background);
      color: var(--text);
      font-family: 'Inter', Arial, sans-serif;
    }
    .bg-video-wrap {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      pointer-events: none;
    }
    .bg-video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 100vh;
      min-width: 177.78vh;
      min-height: 56.25vw;
      transform: translate(-50%, -50%);
      border: 0;
    }
    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(255, 245, 248, 0.55),
          rgba(255, 245, 248, 0.88)
        ),
        rgba(255, 245, 248, 0.35);
      backdrop-filter: blur(6px) saturate(1.1);
      -webkit-backdrop-filter: blur(6px) saturate(1.1);
      pointer-events: none;
    }
    .container {
      width: 100%;
      max-width: 380px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto;
      position: relative;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    .container.is-ready {
      opacity: 1;
    }
    .polaroid {
      width: 100%;
      max-width: 100%;
      padding: 12px 12px 45px;
      margin-bottom: 40px;
      background: #fff;
      border-radius: 2px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      transform: rotate(-2deg);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      position: relative;
    }
    .polaroid::before {
      content: '';
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%) rotate(1deg);
      width: 70px;
      height: 20px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(0, 0, 0, 0.04);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      z-index: 2;
    }
    .polaroid img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      object-position: center;
      border-radius: 1px;
    }
    .name {
      font-family: 'Caveat', cursive;
      font-size: clamp(2.6rem, 12vw, 3.5rem);
      line-height: 1;
      margin-bottom: 5px;
      color: var(--accent);
      text-shadow: 0 1px 12px rgba(255, 255, 255, 0.6);
      text-align: center;
    }
    .bio {
      margin-bottom: 40px;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      text-align: center;
    }
    .links {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-width: 0;
    }
    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-width: 0;
      min-height: 48px;
      padding: 16px 5px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 500;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s ease, padding 0.2s ease;
    }
    .link-item:last-child {
      border-bottom: none;
    }
    .link-left {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 16px;
    }
    .link-left i {
      width: 20px;
      flex-shrink: 0;
      color: var(--muted);
      font-size: 1.2rem;
      text-align: center;
      transition: color 0.2s ease;
    }
    .link-right {
      flex-shrink: 0;
      color: #6b7280;
      font-size: 1rem;
      transition: color 0.2s ease, transform 0.2s ease;
    }
    .link-item:hover,
    .link-item:focus-visible {
      color: var(--accent);
      padding-left: 10px;
    }
    .link-item:hover .link-left i,
    .link-item:focus-visible .link-left i {
      color: var(--accent);
    }
    .link-item:hover .link-right,
    .link-item:focus-visible .link-right {
      color: var(--accent);
      transform: translateX(3px);
    }
    .link-item:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(-70px - env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: calc(100vw - 32px);
      padding: 12px 24px;
      background: var(--text);
      color: #fff;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      opacity: 0;
      pointer-events: none;
      transition: bottom 0.3s ease, opacity 0.3s ease;
      z-index: 100;
    }
    .toast.show {
      bottom: calc(30px + env(safe-area-inset-bottom));
      opacity: 1;
    }
    #skeleton-screen {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      background: var(--background);
      opacity: 1;
      transition: opacity 0.3s ease;
    }
    #skeleton-screen.is-hidden {
      opacity: 0;
      pointer-events: none;
    }
    .skeleton-wrap {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .skeleton {
      position: relative;
      overflow: hidden;
      background: #f3dbe4;
      border-radius: 2px;
    }
    .skeleton::after {
      content: '';
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.75),
        transparent
      );
      animation: shimmer 1.2s infinite;
    }
    @keyframes shimmer {
      100% {
        transform: translateX(100%);
      }
    }
    .sk-polaroid {
      width: 100%;
      padding: 12px 12px 45px;
      margin-bottom: 40px;
      background: #fff;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      transform: rotate(-2deg);
    }
    .sk-photo {
      width: 100%;
      aspect-ratio: 1 / 1;
    }
    .sk-name {
      width: 170px;
      height: 48px;
      margin-bottom: 12px;
      border-radius: 8px;
    }
    .sk-bio {
      width: 150px;
      height: 14px;
      margin-bottom: 40px;
      border-radius: 6px;
    }
    .sk-links {
      width: 100%;
    }
    .sk-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 5px;
      border-bottom: 1px solid var(--line);
    }
    .sk-link:last-child {
      border-bottom: none;
    }
    .sk-link-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .sk-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
    }
    .sk-text {
      width: 90px;
      height: 14px;
      border-radius: 6px;
    }
    .sk-arrow {
      width: 18px;
      height: 14px;
      border-radius: 4px;
    }
    @media (max-width: 600px) {
      body {
        align-items: flex-start;
      }
      .container,
      .skeleton-wrap {
        max-width: 380px;
      }
      .polaroid {
        margin-bottom: 32px;
      }
      .bio {
        margin-bottom: 32px;
        font-size: clamp(0.7rem, 3vw, 0.85rem);
        letter-spacing: 2px;
      }
      .link-item {
        padding: 14px 5px;
        font-size: 16px;
      }
    }
    @media (max-width: 360px) {
      body {
        padding-left: 12px;
        padding-right: 12px;
      }
      .polaroid {
        padding: 8px 8px 32px;
      }
      .link-item {
        padding: 12px 4px;
        font-size: 14px;
      }
      .link-left {
        gap: 8px;
      }
      .bio {
        letter-spacing: 1.5px;
      }
    }
    @media (min-width: 601px) and (max-width: 1024px) {
      .container,
      .skeleton-wrap {
        max-width: 420px;
      }
    }
    @media (min-width: 1025px) {
      .container,
      .skeleton-wrap {
        max-width: 380px;
      }
    }
    @media (hover: none) {
      .polaroid:hover {
        transform: rotate(-2deg);
      }
      .link-item:hover {
        padding-left: 5px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .bg-video-wrap {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="bg-video-wrap" aria-hidden="true">
    <iframe
      id="bg-video"

  <main class="container" id="main-content">
    <div class="polaroid">
      <img
        src="image.png"

  <div class="toast" id="toast" role="status" aria-live="polite">
    <i class="fa-solid fa-check" aria-hidden="true"></i>
    Skopiowano nick!
  </div>

  <script>
    (() => {
      const skeleton = document.getElementById("skeleton-screen");
      const main = document.getElementById("main-content");
      const image = document.querySelector(".polaroid img");
      const start = performance.now();
      const minimumTime = 180;
      const maximumTime = 1500;
      let finished = false;

      function reveal() {
        if (finished) return;
        finished = true;
        const elapsed = performance.now() - start;
        const wait = Math.max(0, minimumTime - elapsed);
        setTimeout(() => {
          main.classList.add("is-ready");
          skeleton.classList.add("is-hidden");
          setTimeout(() => skeleton.remove(), 300);
        }, wait);
      }

      if (image.complete) {
        reveal();
      } else {
        image.addEventListener("load", reveal, { once: true });
        image.addEventListener("error", reveal, { once: true });
      }

      setTimeout(reveal, maximumTime);

      window.addEventListener("pageshow", event => {
        if (event.persisted) reveal();
      });
    })();

    (() => {
      const button = document.getElementById("discord-button");
      const toast = document.getElementById("toast");
      const discordName = "aruyeq";
      let toastTimer;

      function showToast() {
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove("show");
        }, 2000);
      }

      async function copyDiscord() {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(discordName);
          } else {
            const textarea = document.createElement("textarea");
            textarea.value = discordName;
            textarea.setAttribute("readonly", "");
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.select();
            textarea.setSelectionRange(0, textarea.value.length);
            const success = document.execCommand("copy");
            textarea.remove();
            if (!success) throw new Error("Copy failed");
          }
          showToast();
        } catch (error) {
          console.error(error);
          toast.textContent = "Nie udało się skopiować nicku";
          toast.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => {
            toast.classList.remove("show");
            toast.innerHTML =
              '<i class="fa-solid fa-check" aria-hidden="true"></i> Skopiowano nick!';
          }, 2000);
        }
      }

      button.addEventListener("click", copyDiscord);
    })();
  </script>

</html>
