<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aruyeq.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
--text-main: #1f1f1f;
--text-light: #6b7280;
--accent: #db2777;
--line: rgba(219, 39, 119, 0.15);
--bg-color: #fff5f8; 
}
* { 
margin: 0; 
padding: 0; 
box-sizing: border-box; 
-webkit-tap-highlight-color: transparent; 
}
body {
background-color: var(--bg-color);
background-image: radial-gradient(circle at 50% 0%, #ffffff 0%, transparent 70%);
color: var(--text-main);
font-family: 'Inter', sans-serif;
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding: 40px 20px;
position: relative;
}
.container {
width: 100%;
max-width: 380px;
display: flex;
flex-direction: column;
align-items: center;
animation: fadeIn 0.8s ease-out forwards;
position: relative;
z-index: 1;
}
@keyframes fadeIn {
from { opacity: 0; transform: translateY(10px); }
to { opacity: 1; transform: translateY(0); }
}
.polaroid {
background: #ffffff;
padding: 12px 12px 45px 12px;
border-radius: 2px;
box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
transform: rotate(-2deg);
transition: transform 0.4s ease, box-shadow 0.4s ease;
margin-bottom: 40px;
width: 100%;
position: relative;
}
.polaroid:hover {
transform: rotate(0deg) scale(1.02);
box-shadow: 0 18px 40px rgba(0, 0, 0, 0.1);
}
.polaroid img {
width: 100%;
height: 360px;
object-fit: cover;
object-position: center 20%;
border-radius: 1px;
}
.polaroid::before {
content: '';
position: absolute;
top: -8px;
left: 50%;
transform: translateX(-50%) rotate(1deg);
width: 70px;
height: 20px;
background: rgba(255, 255, 255, 0.8);
backdrop-filter: blur(3px);
border: 1px solid rgba(0,0,0,0.04);
z-index: 2;
}
.name {
font-family: 'Caveat', cursive;
font-size: 3.5rem;
color: var(--accent);
line-height: 1;
margin-bottom: 5px;
}
.bio {
font-size: 0.85rem;
color: var(--text-light);
margin-bottom: 40px;
font-weight: 600;
letter-spacing: 2.5px;
text-transform: uppercase;
}
.links {
width: 100%;
display: flex;
flex-direction: column;
}
.link-item {
display: flex;
align-items: center;
justify-content: space-between;
padding: 18px 5px;
text-decoration: none;
color: var(--text-main);
font-size: 1rem;
font-weight: 500;
border-bottom: 1px solid var(--line);
transition: all 0.2s ease;
cursor: pointer;
background: transparent;
border-top: none;
border-left: none;
border-right: none;
width: 100%;
font-family: inherit;
}
.link-item:last-child {
border-bottom: none;
}
.link-left {
display: flex;
align-items: center;
gap: 16px;
}
.link-left i {
font-size: 1.2rem;
color: var(--text-light);
width: 20px;
text-align: center;
transition: color 0.2s ease;
}
.link-right i {
font-size: 1rem;
color: #d1d5db;
transition: all 0.2s ease;
}
.link-item:hover {
color: var(--accent);
padding-left: 10px;
}
.link-item:hover .link-left i {
color: var(--accent);
}
.link-item:hover .link-right i {
color: var(--accent);
transform: translateX(3px);
}
.toast {
position: fixed;
bottom: -60px;
left: 50%;
transform: translateX(-50%);
background: var(--text-main);
color: #ffffff;
padding: 12px 24px;
border-radius: 30px;
font-size: 0.85rem;
font-weight: 500;
display: flex;
align-items: center;
gap: 8px;
transition: bottom 0.3s ease;
box-shadow: 0 10px 25px rgba(0,0,0,0.15);
z-index: 100;
}
.toast.show {
bottom: 30px;
}
</style>
</head>
<body>
<div class="container">
<div class="polaroid">
<img src="image.png" alt="aruyeq">
</div>
<h1 class="name">aruyeq.</h1>
<p class="bio">I use Arch btw</p>
<div class="links">
<div class="link-item" onclick="copyDiscord()">
<div class="link-left">
<i class="fa-brands fa-discord"></i>
<span>Discord</span>
</div>
<i class="fa-regular fa-copy link-right"></i>
</div>
<a href="https://open.spotify.com/user/31nw32sqn4kegpgaqdyq2qqf4gxi" target="_blank" class="link-item">
<div class="link-left">
<i class="fa-brands fa-spotify"></i>
<span>Spotify</span>
</div>
<i class="fa-solid fa-arrow-right link-right"></i>
</a>
<a href="https://github.com/aruyeq" target="_blank" class="link-item">
<div class="link-left">
<i class="fa-brands fa-github"></i>
<span>GitHub</span>
</div>
<i class="fa-solid fa-arrow-right link-right"></i>
</a>
<a href="https://on.soundcloud.com/aG8L15HwOZUbc76N7Z" target="_blank" class="link-item">
<div class="link-left">
<i class="fa-brands fa-soundcloud"></i>
<span>SoundCloud</span>
</div>
<i class="fa-solid fa-arrow-right link-right"></i>
</a>
<a href="https://youtube.com/@aruyeq" target="_blank" class="link-item">
<div class="link-left">
<i class="fa-brands fa-youtube"></i>
<span>YouTube</span>
</div>
<i class="fa-solid fa-arrow-right link-right"></i>
</a>
</div>
</div>
<div class="toast" id="toast">
<i class="fa-solid fa-check"></i> Skopiowano nick!
</div>
<script>
function copyDiscord() {
navigator.clipboard.writeText("aruyeq").then(() => {
const toast = document.getElementById("toast");
toast.classList.add("show");
setTimeout(() => { 
toast.classList.remove("show"); 
}, 2000);
}).catch(err => { 
console.error('Błąd kopiowania: ', err); 
});
}
</script>
</body>
</html>
